<div class="app-viewport">
  <!-- Header only on public pages -->
  <app-header *ngIf="!isAdminRoute()"></app-header>

  <!-- Main Router Outlet -->
  <main class="page-content" [class.admin-mode]="isAdminRoute()">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer only on public pages -->
  <app-footer *ngIf="!isAdminRoute()"></app-footer>

  <!-- Floating Direct WhatsApp Quick Action Button -->

    *ngIf="!isAdminRoute()"

    target="_blank"

    title="تواصل معنا مباشرة عبر واتساب"
    aria-label="تواصل معنا عبر واتساب">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.301-.15-1.782-.879-2.057-.979-.276-.1-.476-.15-.676.15-.2.301-.776.98-1.026 1.281-.25.301-.45.301-.75.15-.301-.15-1.27-.468-2.42-1.493-.895-.798-1.5-1.784-1.675-2.085-.176-.3-.019-.462.131-.611.136-.135.301-.351.451-.527.151-.175.201-.3.301-.501.101-.2.05-.375-.025-.525-.075-.15-.676-1.63-1.002-2.23-.275-.6-.576-.525-.776-.525-.2 0-.426-.025-.651-.025-.226 0-.602.075-.927.426-.326.35-1.253 1.226-1.253 2.984 0 1.758 1.278 3.46 1.454 3.71.175.25 2.511 3.834 6.084 5.378.85.367 1.514.587 2.031.751.854.271 1.631.233 2.246.141.685-.102 1.782-.728 2.032-1.431.25-.702.25-1.303.175-1.43-.075-.126-.275-.226-.576-.376z"/>
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
    </svg>
  </a>

  <!-- Floating Accessibility Button (الموجود أسفل اليسار بالصورة) -->
  <button 
    *ngIf="!isAdminRoute()"
    type="button"
    class="floating-accessibility-btn"
    (click)="toggleAccessibility()"
    title="إمكانية الوصول وتكبير الخط"
    aria-label="إمكانية الوصول">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="12" cy="4.5" r="2.5"/>
      <path d="M12 8c-3.8 0-7 1.5-7 1.5l.8 2.5s2.2-.8 4.2-.9v4.9l-2.5 5.5 2.2 1 2.3-5.2 2.3 5.2 2.2-1-2.5-5.5V11.1c2 .1 4.2.9 4.2.9l.8-2.5S15.8 8 12 8z"/>
    </svg>
  </button>



  <!-- Saud & Farah Cinematic Reception Welcome Overlay -->
  <app-saud-farah-welcome *ngIf="!isAdminRoute()"></app-saud-farah-welcome>

  <!-- Admin Login Modal -->
  <app-admin-login-modal *ngIf="authService.isLoginModalOpen$ | async"></app-admin-login-modal>
</div>
